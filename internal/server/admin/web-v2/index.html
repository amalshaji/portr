<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/portr-mark-on-light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/portr-mark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portr Admin</title>
    <script>
      // Applied before first paint so a dark-mode reload never flashes light.
      // Mirrors resolveTheme() in src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem("portr-admin-theme");
          var preference =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var dark =
            preference === "dark" ||
            (preference === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
